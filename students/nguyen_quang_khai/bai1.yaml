# Bài 1 — 12 thao tác, giữ nguyên lời hướng dẫn trong bài làm của Khải.
# "text" hỗ trợ **đậm** và `tên tệp`. "shots" là ảnh chụp màn hình của bước đó.
folder_root: ThucHanh_nguyenquangkhai
steps:
  - title: Mở File Explorer
    text: 'Nhấn tổ hợp phím **Windows + E** hoặc nhấp vào biểu tượng thư mục màu vàng trên thanh tác vụ.'
    shots:
      - { file: bai1/01_taskbar.webp, cap: Biểu tượng File Explorer trên thanh tác vụ, wide: true }
  - title: Truy cập ổ đĩa/thư mục
    text: 'Ở cột bên trái, nhấp vào **This PC**, sau đó nhấp đúp vào một ổ đĩa không phải ổ hệ thống (ví dụ: ổ D: hoặc E:). Nếu chỉ có ổ C:, hãy vào thư mục **Documents**.'
    shots:
      - { file: bai1/02_this-pc.webp, cap: Chọn PC này (This PC) ở cột bên trái }
      - { file: bai1/03_o-d.webp, cap: 'Nhấp đúp vào ổ DATA (D:)' }
  - title: Tạo thư mục mới
    text: 'Nhấp chuột phải vào một khoảng trống → chọn **New** → **Folder**. Đặt tên thư mục là `ThucHanh_hotensinhvien` (ví dụ: `ThucHanh_nguyenquangkhai`). Nhấn **Enter**.'
    shots:
      - { file: bai1/04_new-folder.webp, cap: Chuột phải → Mới → Cặp (New → Folder) }
  - title: Vào thư mục vừa tạo
    text: 'Nhấp đúp vào thư mục `ThucHanh_nguyenquangkhai`.'
    shots:
      - { file: bai1/05_thu-muc-thuc-hanh.webp, cap: Thư mục ThucHanh_nguyenquangkhai trên ổ D }
  - title: Tạo tệp tin văn bản
    text: 'Nhấp chuột phải vào khoảng trống → **New** → **Text Document**. Đặt tên là `GhiChu.txt`. Nhấn **Enter**.'
    shots:
      - { file: bai1/06_new-text.webp, cap: Chuột phải → Mới → Tài liệu văn bản }
  - title: Đổi tên tệp tin
    text: 'Nhấp chuột phải vào tệp `GhiChu.txt` → chọn **Rename**. Đổi tên thành `GhiChuQuanTrong.txt`. Nhấn **Enter**.'
    shots:
      - { file: bai1/07_rename.webp, cap: Chuột phải vào GhiChu.txt → Đổi tên }
      - { file: bai1/08_da-doi-ten.webp, cap: Gõ tên mới GhiChuQuanTrong.txt }
  - title: Tạo thư mục con
    text: 'Trong thư mục `ThucHanh_nguyenquangkhai`, nhấp chuột phải → **New** → **Folder**. Đặt tên là `TaiLieu`.'
    shots:
      - { file: bai1/09_new-folder-con.webp, cap: Tạo thêm một thư mục bên trong }
      - { file: bai1/10_tailieu.webp, cap: Thư mục con TaiLieu }
  - title: Sao chép tệp tin (Copy & Paste)
    list:
      - 'Nhấp chuột phải vào tệp `GhiChuQuanTrong.txt` → chọn **Copy** (hoặc chọn tệp rồi nhấn **Ctrl + C**).'
      - 'Nhấp đúp vào thư mục `TaiLieu`, nhấp chuột phải vào khoảng trống bên trong → chọn **Paste** (hoặc nhấn **Ctrl + V**). Bây giờ bạn có một bản sao của tệp trong thư mục `TaiLieu`.'
    shots:
      - { file: bai1/11_copy.webp, cap: Chọn Sao (Ctrl + C) }
      - { file: bai1/12_paste.webp, cap: Vào TaiLieu rồi chọn Dán (Ctrl + V) }
      - { file: bai1/13_ban-sao.webp, cap: Bản sao đã nằm trong TaiLieu, wide: true }
  - title: Di chuyển tệp tin (Cut & Paste)
    list:
      - 'Quay lại thư mục `ThucHanh_nguyenquangkhai`. Tạo một tệp mới tên là `DiChuyen.txt`.'
      - 'Nhấp chuột phải vào tệp `DiChuyen.txt` → chọn **Cut** (hoặc chọn tệp rồi nhấn **Ctrl + X**).'
      - 'Nhấp đúp vào thư mục `TaiLieu`, nhấp chuột phải vào khoảng trống → chọn **Paste** (hoặc nhấn **Ctrl + V**). Tệp gốc đã biến mất khỏi vị trí cũ và chỉ còn ở vị trí mới.'
    shots:
      - { file: bai1/14_tao-dichuyen.webp, cap: Quay lại thư mục gốc và tạo DiChuyen.txt }
      - { file: bai1/15_cut.webp, cap: Chọn Cắt (Ctrl + X) }
      - { file: bai1/16_vao-tailieu.webp, cap: Mở thư mục TaiLieu }
      - { file: bai1/17_da-di-chuyen.webp, cap: DiChuyen.txt đã chuyển sang TaiLieu, wide: true }
  - title: Xóa tệp tin
    text: 'Trong thư mục `TaiLieu`, nhấp chuột phải vào tệp `GhiChuQuanTrong.txt` → chọn **Delete**. Tệp sẽ được chuyển vào Thùng rác (Recycle Bin).'
    shots:
      - { file: bai1/18_delete.webp, cap: Chọn Xóa bỏ (Delete) }
      - { file: bai1/19_thung-rac.webp, cap: Tệp vừa xóa nằm trong Thùng rác, wide: true }
  - title: Xóa vĩnh viễn
    text: 'Chọn tệp `DiChuyen.txt`, nhấn giữ phím **Shift** và nhấn phím **Delete**. Một cảnh báo sẽ hiện ra. Nếu đồng ý, tệp sẽ bị xóa vĩnh viễn mà không qua Thùng rác.'
    shots:
      - { file: bai1/20_xoa-vinh-vien.webp, cap: Hộp thoại xác nhận xóa hẳn tệp }
  - title: Khôi phục từ Thùng rác (tùy chọn)
    text: 'Tìm biểu tượng **Recycle Bin** trên màn hình nền, nhấp đúp để mở. Tìm tệp `GhiChuQuanTrong.txt` đã xóa, nhấp chuột phải vào nó và chọn **Restore**. Tệp sẽ quay trở lại vị trí ban đầu.'
    shots:
      - { file: bai1/21_restore.webp, cap: Chuột phải vào tệp → Khôi phục (Restore) }

